spring.datasource.url=jdbc:h2:mem:raizesdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
api.security.token.secret=ChaveSecretaExclusivaDosTestesComPeloMenos32Caracteres
api.security.token.expiration-minutes=60
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
app.pagamento.permitir-status-forcado=true
