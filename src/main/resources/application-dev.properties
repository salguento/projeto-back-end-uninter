# Perfil exclusivo para desenvolvimento local
spring.datasource.url=jdbc:h2:mem:raizesdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:false}

server.error.include-message=always
server.error.include-binding-errors=always

# Segredo conhecido e restrito ao perfil de desenvolvimento. Nunca utilizar em producao.
api.security.token.secret=${JWT_SECRET:ChaveSecretaDesenvolvimentoComPeloMenos32Caracteres123}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

logging.level.root=INFO
logging.level.com.raizesdonordeste=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

app.pagamento.forcar-status=${PAGAMENTO_FORCAR_STATUS:APROVADO}
app.pagamento.forcar-status-estorno=${PAGAMENTO_FORCAR_STATUS_ESTORNO:CONFIRMADO}
app.pagamento.permitir-status-forcado=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
