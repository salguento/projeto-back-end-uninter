spring.application.name=backend-api

# ============================================
# DATABASE CONFIGURATION (definida por perfil)
# ============================================
# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Console (DISABLED BY DEFAULT - enable only in dev profile)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ============================================
# FLYWAY CONFIGURATION
# ============================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true

# ============================================
# JWT CONFIGURATION (USE ENVIRONMENT VARIABLE)
# ============================================
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
server.error.include-message=never
server.error.include-binding-errors=never

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.raizesdonordeste=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [requestId=%X{requestId:-sem-id}] %-5level %logger{36} - %msg%n

# ============================================
# PAGINATION DEFAULTS
# ============================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Reserva de estoque e tentativas de pagamento
app.pedido.reserva-minutos=15
app.pagamento.max-tentativas=3
app.pedido.expiracao-intervalo-ms=60000
app.pagamento.taxa-aprovacao=${PAGAMENTO_TAXA_APROVACAO:0.8}
app.pagamento.permitir-status-forcado=false

# Versao vigente do termo de consentimento para uso do programa de fidelidade
app.lgpd.termo-fidelidade-versao=${LGPD_TERMO_FIDELIDADE_VERSAO:1.0}

# Documentos legais publicados e exigidos no acesso contratual à plataforma
app.documentos.termos-uso.versao=${TERMOS_USO_VERSAO:1.0}
app.documentos.termos-uso.recurso=classpath:legal/termos-uso-v1.0.md
app.documentos.aviso-privacidade.versao=${AVISO_PRIVACIDADE_VERSAO:1.0}
app.documentos.aviso-privacidade.recurso=classpath:legal/aviso-privacidade-v1.0.md

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# CORS CONFIGURATION
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
