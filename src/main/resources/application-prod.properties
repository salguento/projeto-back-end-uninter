# Banco e credenciais obrigatorios em producao
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.flyway.clean-disabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=WARN
logging.level.com.raizesdonordeste=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key,X-Request-ID}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# Nao permite forcar resultado de pagamento em producao.
app.pagamento.forcar-status=
